name: TerminalKun2
options:
  bundleIdPrefix: dev.fuba
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  TerminalKun2:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TerminalKun2:
    type: application
    platform: iOS
    sources: [App]
    resources: [Resources]
    dependencies:
      - package: TerminalKun2
        product: TerminalCore
      - package: TerminalKun2
        product: TerminalTransport
      - package: TerminalKun2
        product: TerminalIME
      - package: TerminalKun2
        product: TerminalRenderer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fuba.terminalkun2
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  TerminalKun2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TerminalKun2
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TerminalKun2:
    build:
      targets:
        TerminalKun2: all
    test:
      targets: [TerminalKun2UITests]
