name: TerminalKun2
options:
  bundleIdPrefix: dev.fuba
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  TerminalKun2:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TerminalKun2:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: TerminalKun2
        product: TerminalCore
      - package: TerminalKun2
        product: TerminalTransport
      - package: TerminalKun2
        product: TerminalIME
      - package: TerminalKun2
        product: TerminalRenderer
    settings:
      base:
        TERMINALKUN2_APP_BUNDLE_ID: dev.fuba.terminalkun2
        TERMINALKUN2_BUILD_NUMBER: 1
        TERMINALKUN2_DEVELOPMENT_TEAM: ''
        PRODUCT_BUNDLE_IDENTIFIER: '$(TERMINALKUN2_APP_BUNDLE_ID)'
        DEVELOPMENT_TEAM: '$(TERMINALKUN2_DEVELOPMENT_TEAM)'
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '$(TERMINALKUN2_BUILD_NUMBER)'
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': App/Simulator.entitlements
        'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
  TerminalKun2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TerminalKun2
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TerminalKun2:
    build:
      targets:
        TerminalKun2: all
    test:
      targets: [TerminalKun2UITests]
